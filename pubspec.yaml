name: fake_call
description: "ShadowCall - Interactive, AI-driven fake call rescue app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_callkit_incoming: ^2.0.2
  vosk_flutter: ^0.3.48
  flutter_tts: ^4.2.2
  google_generative_ai: ^0.4.3
  permission_handler: ^11.3.1
  uuid: ^4.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  http: ^1.2.0
  permission_handler: ^11.3.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/vosk-model/small-en-us
